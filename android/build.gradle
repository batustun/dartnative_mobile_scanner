// dartnative_mobile_scanner Android library module.
// Mirrors the iOS surface in ios/Classes/.

group 'com.dartnative.mobile_scanner'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // NDK r28+ aligns LOAD segments to 16 KB, which Google Play requires for
    // Android 15 and later.
    ndkVersion = "28.2.13676358"
    namespace 'com.dartnative.mobile_scanner'
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        // 24 matches the floor the framework's own AAR declares. CameraX and ML
        // Kit barcode scanning both support 21, so this is the framework's limit
        // rather than ours.
        minSdkVersion 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.annotation:annotation:1.7.1'

    // A headless Fragment is how the camera permission result is received: the
    // framework exposes no Activity-result hook.
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // The scanner drives its own LifecycleRegistry so that an explicit stop is
    // not undone by the Activity coming back to the foreground.
    implementation 'androidx.lifecycle:lifecycle-common:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // CameraX 1.6.2 is the current stable line; 1.7.0 is still alpha.
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'

    // Bundled ML Kit barcode scanning rather than the Play-Services-delivered
    // variant: a scanner must work offline, on the first scan, on a device with no
    // Google Play services. See README "Platform requirements" for the size cost.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // The framework's own classes (DNPluginRegistry, DNViewRegistry, DNAppContext).
    // compileOnly because every DartNative app already provides the module.
    compileOnly project(':dartnative_android')

    testImplementation 'junit:junit:4.13.2'
}
